name: Node.js CI

on:
  push:
    branches: [ master, 'v[0-9]+' ]
  pull_request:
    branches: [ master, 'v[0-9]+' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js '12'
      uses: actions/setup-node@v1
      with:
        node-version: '12'
    - run: yarn
    - run: yarn build
    - run: yarn test